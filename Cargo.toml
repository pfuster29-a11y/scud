[package]
name = "scud"
version = "0.2.0"
edition = "2021"
authors = ["Patricio"]
description = "Safe upgrade and migration guard for Debian Sid"
license = "GPL-3.0-or-later"

[dependencies]
async-channel = "2.5.0"
gtk4 = { version = "0.8", package = "gtk4" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
